name: Helm chart publish

on:
  release:
    types: [published]
  workflow_run:
    workflows: ["Release radarr chart on merge to main"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. radarr-v1.0.0). Default: latest release.'
        required: false

permissions:
  contents: read

jobs:
  package-and-upload:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    uses: expectedbehaviors/github-actions/.github/workflows/helm-chart-publish.yml@main
    secrets: inherit
    with:
      chart_path: .
      chart_name: radarr
      helm_repo_name: bjw-s
      helm_repo_url: https://bjw-s-labs.github.io/helm-charts
      helm_repo_name_2: onepassworditem
      helm_repo_url_2: https://expectedbehaviors.github.io/OnePasswordItem-helm
      tag_version_prefix: radarr-v
      release_tag: ${{ github.event.inputs.release_tag }}
