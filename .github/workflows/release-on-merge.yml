name: Release radarr chart on merge to main

on:
  workflow_dispatch:
    inputs:
      baseline_version:
        description: 'Create baseline release with this version (e.g. 1.0.0) when no tags exist. Leave empty for normal bump.'
        required: false
  push:
    branches: [main]
    paths:
      - 'Chart.yaml'
      - 'values.yaml'
      - 'values/**'
      - 'README.md'
      - '.helmignore'
      - 'templates/**'
  pull_request:
    branches: [main]
    paths:
      - 'Chart.yaml'
      - 'values.yaml'
      - 'values/**'
      - 'README.md'
      - '.helmignore'
      - 'templates/**'

concurrency: release-radarr

jobs:
  validate:
    if: github.event_name == 'pull_request'
    uses: expectedbehaviors/github-actions/.github/workflows/helm-chart-validate.yml@main
    with:
      chart_path: .
      helm_repositories: |
        bjw-s=https://bjw-s-labs.github.io/helm-charts
        onepassworditem=https://expectedbehaviors.github.io/OnePasswordItem-helm

  release:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    uses: expectedbehaviors/github-actions/.github/workflows/helm-chart-release-on-merge.yml@main
    secrets: inherit
    with:
      chart_path: .
      helm_repositories: |
        bjw-s=https://bjw-s-labs.github.io/helm-charts
        onepassworditem=https://expectedbehaviors.github.io/OnePasswordItem-helm
      tag_prefix: radarr-v
      initial_version: ${{ github.event.inputs.baseline_version || '' }}
